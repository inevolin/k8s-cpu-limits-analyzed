<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <rect width="720" height="250" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">what the values file looks like vs what it actually is</text>

  <rect x="24" y="48" width="320" height="172" fill="#fff" stroke="#d8d2c8"/>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">values.yaml</text>
  <text x="40" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">resources:</text>
  <text x="56" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">  requests:</text>
  <text x="72" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#3d5a3d">    cpu: 250m</text>
  <text x="56" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">  limits:</text>
  <text x="72" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#b4482a">    cpu: 500m</text>

  <text x="368" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#888">→</text>

  <rect x="400" y="48" width="296" height="78" fill="#eef2ee" stroke="#c5d0c5"/>
  <text x="416" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3d5a3d">request</text>
  <text x="416" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">your share when the node is busy</text>

  <rect x="400" y="142" width="296" height="78" fill="#f6eeea" stroke="#e0c8c0"/>
  <text x="416" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b4482a">limit</text>
  <text x="416" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">a freeze, even if cores are idle</text>
</svg>
