<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <title>Two pods take turns on one CPU</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 14px; fill: #111; }
    .sub { font-size: 13px; fill: #111; }
    .tiny { font-size: 12px; fill: #111; }
    .who { font-size: 28px; fill: #111; }
    .card { fill: #f7f3ea; stroke: #b8b2a8; }
    #whoA { animation: whoA 16s steps(1) infinite; }
    #whoB { animation: whoB 16s steps(1) infinite; }
    #cpu { animation: cpu 16s steps(1) infinite; }
    #capBoth { animation: onFirst 16s steps(1) infinite; }
    #capIdle { animation: onSecond 16s steps(1) infinite; }
    #podB { animation: podB 16s steps(1) infinite; }
    /* 16s: 0-50% both busy A,BBB,A,BBB. 50-100% B idle, always A. */
    @keyframes whoA {
      0%, 6.2% { opacity: 1; }
      6.3%, 24.9% { opacity: 0; }
      25%, 31.2% { opacity: 1; }
      31.3%, 49.9% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes whoB {
      0%, 6.2% { opacity: 0; }
      6.3%, 24.9% { opacity: 1; }
      25%, 31.2% { opacity: 0; }
      31.3%, 49.9% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes onFirst {
      0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; }
    }
    @keyframes onSecond {
      0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; }
    }
    @keyframes podB {
      0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0.3; }
    }
    @keyframes cpu {
      0%, 49.9% { fill: #8fbf8f; } 50%, 100% { fill: #c5ddc5; }
    }
  </style>
  <rect width="720" height="300" fill="#faf9f6"/>
  <text class="title" x="24" y="30">One machine. Two pods. They take turns.</text>

  <text id="capBoth" class="sub" x="24" y="54">Both want the CPU. B asked for more, so B gets more turns.</text>
  <text id="capIdle" class="sub" x="24" y="54">B stepped away. A gets the leftover. No CPU limit anywhere.</text>

  <rect class="card" x="24" y="80" width="180" height="120"/>
  <text class="tiny" x="40" y="112">your app</text>
  <text class="sub" x="40" y="140">request 250m</text>
  <text class="tiny" x="40" y="168">1 turn out of 4</text>

  <rect id="cpu" x="248" y="80" width="224" height="120" fill="#8fbf8f" stroke="#6a906a"/>
  <text class="tiny" x="268" y="108">the CPU, right now</text>
  <text id="whoA" class="who" x="332" y="162">A</text>
  <text id="whoB" class="who" x="332" y="162">B</text>

  <rect id="podB" class="card" x="516" y="80" width="180" height="120"/>
  <text class="tiny" x="532" y="112">the other app</text>
  <text class="sub" x="532" y="140">request 750m</text>
  <text class="tiny" x="532" y="168">3 turns out of 4</text>

  <text class="tiny" x="24" y="232">Only one pod can use the CPU at a time. Like one microphone.</text>
  <text class="tiny" x="24" y="254">A paid for a quarter of the time, B paid for three quarters.</text>
  <text class="tiny" x="24" y="276">When B is quiet, A can talk. When B comes back, they share again. That is CFS.</text>
</svg>
