<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <title>Four cores. Pod A reserved one. Pod B reserved three. No limit on either.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 14px; fill: #111; }
    .sub { font-size: 13px; fill: #111; }
    .tiny { font-size: 12px; fill: #111; }
    .core { stroke: #111; stroke-width: 1.2; }
    .coreno { font-size: 10px; fill: #444; }
    #capBusy { animation: first 5s linear infinite; }
    #capIdle { animation: second 5s linear infinite; }
    #c2, #c3, #c4 { animation: borrow 5s linear infinite; }
    #labB2, #labB3, #labB4 { animation: first 5s linear infinite; }
    #labA2, #labA3, #labA4, #labA2b, #labA3b, #labA4b { animation: second 5s linear infinite; }
    @keyframes first {
      0%, 47% { opacity: 1; } 50%, 100% { opacity: 0; }
    }
    @keyframes second {
      0%, 47% { opacity: 0; } 50%, 100% { opacity: 1; }
    }
    @keyframes borrow {
      0%, 47% { fill: #a3cfa3; }
      50%, 100% { fill: #6aa96a; }
    }
  </style>
  <rect width="720" height="300" fill="#faf9f6"/>
  <text class="title" x="24" y="30">A node with 4 cores. Pod A requests 1 core, Pod B requests 3 cores.</text>

  <rect class="core" x="40" y="80" width="140" height="120" fill="#6aa96a"/>
  <text class="coreno" x="48" y="96">core 1</text>
  <text class="tiny" x="110" y="146" text-anchor="middle">Pod A: working...</text>

  <rect id="c2" class="core" x="200" y="80" width="140" height="120" fill="#a3cfa3"/>
  <text class="coreno" x="208" y="96">core 2</text>
  <text id="labB2" class="tiny" x="270" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA2" class="tiny" x="270" y="140" text-anchor="middle">A borrows</text>
  <text id="labA2b" class="tiny" x="270" y="160" text-anchor="middle">unused core</text>

  <rect id="c3" class="core" x="360" y="80" width="140" height="120" fill="#a3cfa3"/>
  <text class="coreno" x="368" y="96">core 3</text>
  <text id="labB3" class="tiny" x="430" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA3" class="tiny" x="430" y="140" text-anchor="middle">A borrows</text>
  <text id="labA3b" class="tiny" x="430" y="160" text-anchor="middle">unused core</text>

  <rect id="c4" class="core" x="520" y="80" width="140" height="120" fill="#a3cfa3"/>
  <text class="coreno" x="528" y="96">core 4</text>
  <text id="labB4" class="tiny" x="590" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA4" class="tiny" x="590" y="140" text-anchor="middle">A borrows</text>
  <text id="labA4b" class="tiny" x="590" y="160" text-anchor="middle">unused core</text>

  <rect x="40" y="220" width="16" height="16" fill="#6aa96a" stroke="#111"/>
  <text class="tiny" x="64" y="233">pod A request (1 core)</text>
  <rect x="300" y="220" width="16" height="16" fill="#a3cfa3" stroke="#111"/>
  <text class="tiny" x="324" y="233">pod B request (3 cores)</text>

  <text id="capBusy" class="sub" x="24" y="256">Both busy. Each gets its request. No CPU limit.</text>
  <text id="capIdle" class="sub" x="24" y="256">Pod B went idle. Pod A uses the leftover cores.</text>

  <text class="tiny" x="24" y="282">When pod B needs CPU again, those cores go back. No limit was ever set.</text>
</svg>
