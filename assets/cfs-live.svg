<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326">
  <title>Four cores. Pod A reserved one. Pod B reserved three. No limit on either.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 14px; fill: #111; }
    .sub { font-size: 13px; fill: #111; }
    .tiny { font-size: 12px; fill: #111; }
    .core { stroke: #111; stroke-width: 1.2; }
    .coreno { font-size: 10px; fill: #444; }
    #capBusy { animation: state1 6s linear infinite; }
    #capPartial { animation: state2 6s linear infinite; }
    #capIdle { animation: state3 6s linear infinite; }
    #labB2 { animation: state1 6s linear infinite; }
    #labA2, #labA2b, #ov2 { animation: state2and3 6s linear infinite; }
    #labB3, #labB4 { animation: state1and2 6s linear infinite; }
    #labA3, #labA3b, #labA4, #labA4b, #ov3, #ov4 { animation: state3 6s linear infinite; }
    #c2 { animation: coreStroke2 6s linear infinite; }
    #c3, #c4 { animation: coreStroke34 6s linear infinite; }
    /* three states per loop: 0-31% all busy, 33-64% pod B down to 2
       cores (core 2 borrowed), 66-97% pod B fully idle (all borrowed) */
    @keyframes state1 {
      0%, 31% { opacity: 1; } 33%, 100% { opacity: 0; }
    }
    @keyframes state2 {
      0%, 31% { opacity: 0; } 33%, 64% { opacity: 1; } 66%, 100% { opacity: 0; }
    }
    @keyframes state3 {
      0%, 64% { opacity: 0; } 66%, 97% { opacity: 1; } 100% { opacity: 0; }
    }
    @keyframes state2and3 {
      0%, 31% { opacity: 0; } 33%, 97% { opacity: 1; } 100% { opacity: 0; }
    }
    @keyframes state1and2 {
      0%, 64% { opacity: 1; } 66%, 100% { opacity: 0; }
    }
    @keyframes coreStroke2 {
      0%, 31% { stroke-opacity: 1; } 33%, 100% { stroke-opacity: 0; }
    }
    @keyframes coreStroke34 {
      0%, 64% { stroke-opacity: 1; } 66%, 100% { stroke-opacity: 0; }
    }
  </style>
  <rect width="720" height="326" fill="#faf9f6"/>
  <text class="title" x="24" y="30">A node with 4 cores. Pod A requests 1 core, Pod B requests 3 cores.</text>

  <rect class="core" x="40" y="80" width="140" height="120" fill="#6aa96a"/>
  <text class="coreno" x="48" y="96">core 1</text>
  <text class="tiny" x="110" y="146" text-anchor="middle">Pod A: working...</text>

  <rect id="c2" class="core" fill="#a3cfa3" x="200" y="80" width="140" height="120"/>
  <rect id="ov2" x="200" y="80" width="140" height="120" fill="none" stroke="#4878a8" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text class="coreno" x="208" y="96">core 2</text>
  <text id="labB2" class="tiny" x="270" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA2" class="tiny" x="270" y="140" text-anchor="middle">A borrows</text>
  <text id="labA2b" class="tiny" x="270" y="160" text-anchor="middle">unused core</text>

  <rect id="c3" class="core" fill="#a3cfa3" x="360" y="80" width="140" height="120"/>
  <rect id="ov3" x="360" y="80" width="140" height="120" fill="none" stroke="#4878a8" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text class="coreno" x="368" y="96">core 3</text>
  <text id="labB3" class="tiny" x="430" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA3" class="tiny" x="430" y="140" text-anchor="middle">A borrows</text>
  <text id="labA3b" class="tiny" x="430" y="160" text-anchor="middle">unused core</text>

  <rect id="c4" class="core" fill="#a3cfa3" x="520" y="80" width="140" height="120"/>
  <rect id="ov4" x="520" y="80" width="140" height="120" fill="none" stroke="#4878a8" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text class="coreno" x="528" y="96">core 4</text>
  <text id="labB4" class="tiny" x="590" y="148" text-anchor="middle">Pod B: working...</text>
  <text id="labA4" class="tiny" x="590" y="140" text-anchor="middle">A borrows</text>
  <text id="labA4b" class="tiny" x="590" y="160" text-anchor="middle">unused core</text>

  <rect x="40" y="230" width="16" height="16" fill="#6aa96a" stroke="#111"/>
  <text class="tiny" x="64" y="243">Pod A request (1 core)</text>
  <rect x="300" y="230" width="16" height="16" fill="#a3cfa3" stroke="#111"/>
  <text class="tiny" x="324" y="243">Pod B request (3 cores)</text>
  <rect x="560" y="230" width="16" height="16" fill="none" stroke="#4878a8" stroke-width="2" stroke-dasharray="4,3"/>
  <text class="tiny" x="584" y="243">Borrowed by pod A</text>

  <text id="capBusy" class="sub" x="24" y="276">Both busy. Each gets its request. No CPU limit.</text>
  <text id="capPartial" class="sub" x="24" y="276">Pod B only needs 2 cores right now. Pod A borrows the third.</text>
  <text id="capIdle" class="sub" x="24" y="276">Pod B went idle. Pod A uses the leftover cores.</text>

  <text class="tiny" x="24" y="302">When pod B needs CPU again, those cores go back. No limit was ever set.</text>
</svg>
