<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270">
  <rect width="720" height="270" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">what the values file looks like vs what it actually is</text>

  <rect x="24" y="48" width="320" height="198" fill="#f7f3ea" stroke="#b8b2a8"/>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">values.yaml</text>
  <text x="40" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">resources:</text>
  <text x="56" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">  requests:</text>
  <text x="72" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#2d6a2d">    cpu: 250m</text>
  <text x="56" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">  limits:</text>
  <text x="72" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8a2f18">    cpu: 500m</text>

  <text x="360" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111111">→</text>

  <rect x="400" y="48" width="296" height="92" fill="#e8f0e8" stroke="#8aaa8a"/>
  <text x="416" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">request</text>
  <text x="416" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">what your pod is</text>
  <text x="416" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">guaranteed to get</text>

  <rect x="400" y="152" width="296" height="94" fill="#f6eeea" stroke="#d0a090"/>
  <text x="416" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8a2f18">limit</text>
  <text x="416" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">the most it may use.</text>
  <text x="416" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">pod paused until next window</text>
</svg>
