<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <title>A CPU limit pauses the app every 100 ms</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 14px; fill: #1a1a1a; }
    .sub { font-size: 12px; fill: #111111; }
    .tiny { font-size: 11px; fill: #111111; }
    .ink { font-size: 11px; fill: #111111; }
    .wait { font-size: 11px; fill: #8a2f18; }
    .lane { fill: #ffffff; stroke: #c8c2b8; }
    #play { animation: play 4s linear infinite; }
    #run4 { animation: run4 4s linear infinite; }
    #run1 { animation: run1 4s linear infinite; }
    #runOpen { animation: runOpen 4s linear infinite; }
    #tagRun { animation: tagRun 4s linear infinite; }
    #tagPause { animation: tagPause 4s linear infinite; }
    @keyframes play {
      0% { x: 80; } 50% { x: 677; } 50.01% { x: 80; } 100% { x: 677; }
    }
    @keyframes run4 {
      0% { width: 0; }
      12.5%, 50% { width: 75px; }
      50.01% { width: 0; }
      62.5%, 100% { width: 75px; }
    }
    @keyframes run1 {
      0% { width: 0; }
      25%, 50% { width: 300px; }
      50.01% { width: 0; }
      75%, 100% { width: 300px; }
    }
    @keyframes runOpen {
      0% { width: 0; }
      50% { width: 600px; }
      50.01% { width: 0; }
      100% { width: 600px; }
    }
    @keyframes tagRun {
      0%, 12% { opacity: 1; } 13%, 49% { opacity: 0; }
      50%, 62% { opacity: 1; } 63%, 100% { opacity: 0; }
    }
    @keyframes tagPause {
      0%, 12% { opacity: 0; } 13%, 49% { opacity: 1; }
      50%, 62% { opacity: 0; } 63%, 100% { opacity: 1; }
    }
  </style>
  <rect width="720" height="380" fill="#faf9f6"/>
  <text class="title" x="24" y="30">One 100 ms window, slowed down so you can see it</text>
  <text class="sub" x="24" y="50">500m limit = 50 ms of CPU, then: pod paused until next window.</text>

  <rect x="80" y="68" width="600" height="14" rx="2" fill="#e8e4dc"/>
  <rect id="play" x="80" y="64" width="3" height="22" fill="#111111"/>
  <text class="tiny" x="80" y="100">0 ms</text>
  <text class="tiny" x="348" y="100">50 ms  (budget gone)</text>
  <text class="tiny" x="640" y="100">100</text>

  <text class="sub" x="24" y="128">4 threads, 500m limit</text>
  <rect class="lane" x="80" y="138" width="600" height="28" rx="3"/>
  <rect x="80" y="142" width="600" height="20" fill="#efe8dc"/>
  <rect id="run4" x="80" y="142" width="0" height="20" fill="#8fbf8f"/>
  <text id="tagRun" class="ink" x="90" y="156">running</text>
  <text id="tagPause" class="wait" x="168" y="156">pod paused until next window</text>
  <text class="tiny" x="80" y="184">Used up the 50 ms too fast. Pod paused until next window.</text>

  <text class="sub" x="24" y="214">1 thread, 500m limit</text>
  <rect class="lane" x="80" y="224" width="600" height="28" rx="3"/>
  <rect x="80" y="228" width="600" height="20" fill="#efe8dc"/>
  <rect id="run1" x="80" y="228" width="0" height="20" fill="#8fbf8f"/>
  <text class="tiny" x="80" y="270">Uses the whole 50 ms. Then: pod paused until next window.</text>

  <text class="sub" x="24" y="298">no limit</text>
  <rect class="lane" x="80" y="308" width="600" height="28" rx="3"/>
  <rect x="80" y="312" width="600" height="20" fill="#efe8dc"/>
  <rect id="runOpen" x="80" y="312" width="0" height="20" fill="#8fbf8f"/>
  <text class="tiny" x="80" y="354">Keeps going. Leftover cores are allowed.</text>
</svg>
