<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <title>A CPU limit pauses the app every 100 ms</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .title { font-size: 14px; fill: #1a1a1a; }
    .sub { font-size: 12px; fill: #111111; }
    .tiny { font-size: 11px; fill: #111111; }
    .ink { font-size: 11px; fill: #111111; }
    .wait { font-size: 11px; fill: #c4473a; }
    .limitctx { font-size: 10px; fill: #c4473a; }
    .openctx { font-size: 12px; fill: #5a9a5a; }
    .lane { fill: #ffffff; stroke: #c8c2b8; }
    #play { animation: play 4s linear infinite; }
    #run4 { animation: run4 4s linear infinite; }
    #run1 { animation: run1 4s linear infinite; }
    #runOpen { animation: runOpen 4s linear infinite; }
    #tagRun { animation: tagRun 4s linear infinite; }
    #tagPause { animation: tagPause 4s linear infinite; }
    #tagRun1 { animation: tagRun1 4s linear infinite; }
    #tagPause1 { animation: tagPause1 4s linear infinite; }
    @keyframes play {
      0% { x: 80; } 50% { x: 677; } 50.01% { x: 80; } 100% { x: 677; }
    }
    /* 4 threads x 125m each burn the 50 ms budget in 50/4 = 12.5 ms of
       wall-clock time, i.e. 12.5% of the 100 ms window = 6.25% of this
       4s loop (the window itself spans 0-50% / 50-100%). */
    @keyframes run4 {
      0% { width: 0; }
      6.25%, 50% { width: 75px; }
      50.01% { width: 0; }
      56.25%, 100% { width: 75px; }
    }
    /* 1 thread at 500m burns the 50 ms budget in 50 ms of wall-clock
       time, i.e. 50% of the window = 25% of this loop. */
    @keyframes run1 {
      0% { width: 0; }
      25%, 50% { width: 300px; }
      50.01% { width: 0; }
      75%, 100% { width: 300px; }
    }
    @keyframes runOpen {
      0% { width: 0; }
      50% { width: 600px; }
      50.01% { width: 0; }
      100% { width: 600px; }
    }
    @keyframes tagRun {
      0%, 6.2% { opacity: 1; } 6.3%, 49.9% { opacity: 0; }
      50%, 56.2% { opacity: 1; } 56.3%, 100% { opacity: 0; }
    }
    @keyframes tagPause {
      0%, 6.2% { opacity: 0; } 6.3%, 49.9% { opacity: 1; }
      50%, 56.2% { opacity: 0; } 56.3%, 100% { opacity: 1; }
    }
    @keyframes tagRun1 {
      0%, 24.9% { opacity: 1; } 25%, 49.9% { opacity: 0; }
      50%, 74.9% { opacity: 1; } 75%, 100% { opacity: 0; }
    }
    @keyframes tagPause1 {
      0%, 24.9% { opacity: 0; } 25%, 49.9% { opacity: 1; }
      50%, 74.9% { opacity: 0; } 75%, 100% { opacity: 1; }
    }
  </style>
  <rect width="720" height="380" fill="#faf9f6"/>
  <text class="title" x="24" y="30">One 100 ms window, slowed down so you can see it</text>
  <text class="sub" x="24" y="50">500m limit = 50 ms of CPU time, shared by every thread in the pod.</text>

  <rect x="80" y="68" width="600" height="14" rx="2" fill="#e8e4dc"/>
  <rect id="play" x="80" y="64" width="3" height="22" fill="#111111"/>
  <line x1="380" y1="68" x2="380" y2="82" stroke="#c8c2b8" stroke-width="1"/>
  <text class="tiny" x="80" y="100">0 ms</text>
  <text class="tiny" x="357" y="100">50 ms</text>
  <text class="tiny" x="634" y="100">100 ms</text>

  <text class="sub" x="24" y="128">4 threads, 500m limit</text>
  <rect class="lane" x="80" y="138" width="600" height="28" rx="3"/>
  <rect x="80" y="142" width="600" height="20" fill="#f6eeea"/>
  <rect id="run4" x="80" y="142" width="0" height="20" fill="#8fbf8f"/>
  <line x1="155" y1="134" x2="155" y2="170" stroke="#c4473a" stroke-width="1" stroke-dasharray="2,2"/>
  <text class="limitctx" x="214" y="132">Budget gone ~12 ms</text>
  <text id="tagRun" class="ink" x="90" y="156">Running</text>
  <text id="tagPause" class="wait" x="163" y="156">Throttled</text>
  <text class="tiny" x="80" y="184">4 threads split the 50 ms budget, so it's gone in ~12 ms.</text>

  <text class="sub" x="24" y="214">1 thread, 500m limit</text>
  <rect class="lane" x="80" y="224" width="600" height="28" rx="3"/>
  <rect x="80" y="228" width="600" height="20" fill="#f6eeea"/>
  <rect id="run1" x="80" y="228" width="0" height="20" fill="#8fbf8f"/>
  <line x1="380" y1="220" x2="380" y2="256" stroke="#c4473a" stroke-width="1" stroke-dasharray="2,2"/>
  <text class="limitctx" x="384" y="218">Budget gone 50 ms</text>
  <text id="tagRun1" class="ink" x="90" y="242">Running</text>
  <text id="tagPause1" class="wait" x="390" y="242">Throttled</text>
  <text class="tiny" x="80" y="270">One thread alone takes the full 50 ms to spend the budget.</text>

  <text class="sub openctx" x="24" y="298">No limit</text>
  <rect class="lane" x="80" y="308" width="600" height="28" rx="3"/>
  <rect x="80" y="312" width="600" height="20" fill="#eef4ee"/>
  <rect id="runOpen" x="80" y="312" width="0" height="20" fill="#8fbf8f"/>
  <text class="tiny openctx" x="80" y="354">No budget to run out of. Keeps going all 100 ms on leftover cores.</text>
</svg>
