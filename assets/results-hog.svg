<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <rect width="720" height="240" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">hog on the node  ·  victim has no CPU limit</text>

  <!-- 0-80ms, 50-200 = 150px → 1.875 px/ms -->
  <line x1="80" y1="50" x2="80" y2="200" stroke="#ccc"/>
  <line x1="80" y1="200" x2="680" y2="200" stroke="#222"/>
  <text x="48" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">0</text>
  <text x="40" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">40</text>
  <line x1="80" y1="125" x2="680" y2="125" stroke="#eee"/>
  <text x="40" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">80</text>

  <!-- 52.9 → 99 y=101; 49.2 → 92 y=108 -->
  <rect x="180" y="101" width="80" height="99" fill="#3d5a3d"/>
  <rect x="400" y="108" width="80" height="92" fill="#6a8a6a"/>
  <text x="200" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3d5a3d">53 ms</text>
  <text x="420" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3d5a3d">49 ms</text>
  <text x="188" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">p99, no hog</text>
  <text x="396" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">p99, hog on node</text>
</svg>
