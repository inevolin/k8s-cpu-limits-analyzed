<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <rect width="720" height="240" fill="#faf9f6"/>
  <text x="24" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">Run out of CPU and the app waits. Run out of memory and it dies.</text>

  <!-- CPU panel -->
  <rect x="24" y="42" width="330" height="182" fill="#ffffff" stroke="#c7c2b8"/>
  <text x="40" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="bold" fill="#5a9a5a">CPU</text>
  <text x="40" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555555" text-anchor="start" dx="42">compressible</text>

  <!-- demand line dips under a limit, then continues -->
  <line x1="40" y1="92" x2="318" y2="92" stroke="#d8d2c4" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="322" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#999999" text-anchor="end">limits.cpu</text>
  <path d="M 40 100 L 90 100 L 110 130 L 150 130 L 170 100 L 318 100"
        fill="none" stroke="#5a9a5a" stroke-width="2.5"/>
  <text x="130" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555555" text-anchor="middle">Throttled, then catches up</text>

  <text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">App waits, then finishes late</text>
  <text x="40" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#5a9a5a">drop limits.cpu, keep requests.cpu</text>

  <!-- Memory panel -->
  <rect x="366" y="42" width="330" height="182" fill="#fff5f3" stroke="#e0b3a8"/>
  <text x="382" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="bold" fill="#c14f3d">memory</text>
  <text x="382" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555555" text-anchor="start" dx="90">not compressible</text>

  <line x1="382" y1="92" x2="660" y2="92" stroke="#e0b3a8" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="664" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c48a80" text-anchor="end">limits.memory</text>
  <!-- demand line rises and hits a hard wall, stops -->
  <path d="M 382 130 L 440 130 L 480 100 L 528 92" fill="none" stroke="#c14f3d" stroke-width="2.5"/>
  <circle cx="528" cy="92" r="4.5" fill="#c14f3d"/>
  <line x1="528" y1="80" x2="528" y2="140" stroke="#c14f3d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="528" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#c14f3d" text-anchor="middle" font-weight="bold">Killed. No recovery.</text>

  <text x="382" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">App is OOM-killed</text>
  <text x="382" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#c14f3d">keep limits.memory and requests.memory</text>
</svg>
