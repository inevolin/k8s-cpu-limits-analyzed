<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <rect width="720" height="320" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">What your dashboard shows vs what the pod is doing</text>

  <text x="28" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111" transform="rotate(-90 28 120)">CPU</text>

  <line x1="56" y1="58" x2="680" y2="58" stroke="#c45a38" stroke-dasharray="5 4" stroke-width="1.5"/>
  <line x1="56" y1="188" x2="680" y2="188" stroke="#111" stroke-width="1"/>

  <!-- 24 seconds, 24px each, x=60 -->
  <g>
    <rect x="60" y="118" width="18" height="70" fill="#8fbf8f"/>
    <rect x="84" y="98" width="18" height="90" fill="#8fbf8f"/>
    <rect x="108" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="132" y="136" width="18" height="52" fill="#8fbf8f"/>
    <rect x="156" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="180" y="108" width="18" height="80" fill="#8fbf8f"/>
    <rect x="204" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="228" y="148" width="18" height="40" fill="#8fbf8f"/>
    <rect x="252" y="94" width="18" height="94" fill="#8fbf8f"/>
    <rect x="276" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="300" y="126" width="18" height="62" fill="#8fbf8f"/>
    <rect x="324" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="348" y="104" width="18" height="84" fill="#8fbf8f"/>
    <rect x="372" y="140" width="18" height="48" fill="#8fbf8f"/>
    <rect x="396" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="420" y="116" width="18" height="72" fill="#8fbf8f"/>
    <rect x="444" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="468" y="132" width="18" height="56" fill="#8fbf8f"/>
    <rect x="492" y="96" width="18" height="92" fill="#8fbf8f"/>
    <rect x="516" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="540" y="144" width="18" height="44" fill="#8fbf8f"/>
    <rect x="564" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="588" y="112" width="18" height="76" fill="#8fbf8f"/>
    <rect x="612" y="58" width="18" height="130" fill="#c45a38"/>
    <rect x="636" y="128" width="18" height="60" fill="#8fbf8f"/>
    <rect x="660" y="58" width="18" height="130" fill="#c45a38"/>
  </g>

  <line x1="56" y1="128" x2="680" y2="128" stroke="#111" stroke-width="2.5"/>

  <text x="56" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">0s</text>
  <text x="640" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">~30s</text>

  <!-- legend -->
  <rect x="56" y="228" width="608" height="72" fill="#fff" stroke="#d0cbc2"/>

  <rect x="72" y="244" width="14" height="14" fill="#8fbf8f"/>
  <text x="94" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">CPU that second, under the limit</text>

  <rect x="72" y="268" width="14" height="14" fill="#c45a38"/>
  <text x="94" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">hit the limit — pod paused until next window</text>

  <line x1="400" y1="251" x2="428" y2="251" stroke="#111" stroke-width="2.5"/>
  <text x="436" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">1-minute average</text>

  <line x1="400" y1="275" x2="428" y2="275" stroke="#c45a38" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="436" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">CPU limit</text>
</svg>
