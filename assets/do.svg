<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <rect width="720" height="220" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">what to set</text>

  <rect x="24" y="52" width="216" height="140" fill="#eef2ee" stroke="#c5d0c5"/>
  <text x="40" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8fbf8f">keep</text>
  <text x="40" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">CPU request</text>
  <text x="40" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">share + scheduling</text>

  <rect x="252" y="52" width="216" height="140" fill="#eef2ee" stroke="#c5d0c5"/>
  <text x="268" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8fbf8f">keep</text>
  <text x="268" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">memory limit</text>
  <text x="268" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">or a leak takes the node</text>

  <rect x="480" y="52" width="216" height="140" fill="#f6eeea" stroke="#e0c8c0"/>
  <text x="496" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#b4482a">drop</text>
  <text x="496" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">CPU limit</text>
  <text x="496" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">except untrusted</text>
  <text x="496" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">code, benches,</text>
  <text x="496" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">pinned cores</text>
</svg>
