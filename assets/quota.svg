<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">one 100 ms window, 500m limit (50 ms of CPU time)</text>

  <text x="24" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">1 busy thread</text>
  <rect x="160" y="52" width="250" height="22" fill="#3d5a3d"/>
  <rect x="410" y="52" width="250" height="22" fill="#e4ddd2"/>
  <text x="168" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffffff">runs 50 ms</text>
  <text x="418" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#333333">frozen 50 ms</text>

  <text x="24" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">4 busy threads</text>
  <rect x="160" y="102" width="62" height="22" fill="#3d5a3d"/>
  <rect x="222" y="102" width="438" height="22" fill="#e4ddd2"/>
  <text x="168" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffffff">~12 ms</text>
  <text x="230" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#333333">frozen ~88 ms</text>

  <text x="24" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">no limit</text>
  <rect x="160" y="152" width="500" height="22" fill="#3d5a3d"/>
  <text x="168" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffffff">runs the whole window</text>

  <line x1="160" y1="200" x2="660" y2="200" stroke="#222" stroke-width="1"/>
  <text x="160" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">0</text>
  <text x="400" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">50 ms</text>
  <text x="638" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">100 ms</text>

</svg>
