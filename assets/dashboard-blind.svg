<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330">
  <rect width="800" height="330" fill="#faf9f6"/>
  <text x="20" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">Same 30 seconds. Two stories.</text>

  <!-- ============ PANEL A: dashboard average CPU ============ -->
  <text x="50" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">dashboard: average CPU</text>

  <!-- gridlines aligned to time ticks -->
  <line x1="50" y1="60" x2="50" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="157" y1="60" x2="157" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="263" y1="60" x2="263" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="370" y1="60" x2="370" y2="230" stroke="#e5e2da" stroke-width="1"/>

  <!-- CPU limit (dashed) -->
  <line x1="50" y1="72" x2="370" y2="72" stroke="#e07a6c" stroke-dasharray="5 4" stroke-width="1.5"/>
  <!-- baseline -->
  <line x1="50" y1="230" x2="370" y2="230" stroke="#111" stroke-width="1"/>

  <!-- flat, boring average CPU line: well under the limit, barely moves -->
  <polyline points="50,196 66,198 82,194 98,199 114,195 130,197 146,193 162,198 178,196 194,199 210,195 226,197 242,194 258,198 274,196 290,199 306,195 322,197 338,194 354,198 370,196"
    fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="376" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#e07a6c">limit</text>
  <text x="50" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">0s</text>
  <text x="356" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">30s</text>
  <text x="20" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111" transform="rotate(-90 20 145)">CPU</text>

  <text x="50" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">Looks flat. Looks fine.</text>

  <!-- divider -->
  <line x1="405" y1="40" x2="405" y2="290" stroke="#ccc7ba" stroke-width="1"/>

  <!-- ============ PANEL B: throttled periods ============ -->
  <text x="430" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">container_cpu_cfs_throttled_periods_total</text>

  <line x1="430" y1="60" x2="430" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="537" y1="60" x2="537" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="643" y1="60" x2="643" y2="230" stroke="#e5e2da" stroke-width="1"/>
  <line x1="750" y1="60" x2="750" y2="230" stroke="#e5e2da" stroke-width="1"/>

  <line x1="430" y1="230" x2="750" y2="230" stroke="#111" stroke-width="1"/>

  <!-- 30 one-second bars: pod is throttled hard and often, severe + spiky -->
  <g>
    <rect x="432" y="70"  width="8" height="160" fill="#e07a6c"/>
    <rect x="443" y="180" width="8" height="50"  fill="#d9d4c7"/>
