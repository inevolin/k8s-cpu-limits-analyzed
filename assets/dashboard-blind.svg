<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#faf9f6"/>
  <text x="20" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">Same 30 seconds. Two stories.</text>

  <!-- plot -->
  <text x="14" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111" transform="rotate(-90 14 130)">CPU</text>
  <line x1="40" y1="52" x2="500" y2="52" stroke="#e07a6c" stroke-dasharray="5 4" stroke-width="1.5"/>
  <line x1="40" y1="188" x2="500" y2="188" stroke="#111" stroke-width="1"/>

  <g>
    <rect x="44" y="118" width="16" height="70" fill="#8fbf8f"/>
    <rect x="62" y="98" width="16" height="90" fill="#8fbf8f"/>
    <rect x="80" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="98" y="136" width="16" height="52" fill="#8fbf8f"/>
    <rect x="116" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="134" y="108" width="16" height="80" fill="#8fbf8f"/>
    <rect x="152" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="170" y="148" width="16" height="40" fill="#8fbf8f"/>
    <rect x="188" y="94" width="16" height="94" fill="#8fbf8f"/>
    <rect x="206" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="224" y="126" width="16" height="62" fill="#8fbf8f"/>
    <rect x="242" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="260" y="104" width="16" height="84" fill="#8fbf8f"/>
    <rect x="278" y="140" width="16" height="48" fill="#8fbf8f"/>
    <rect x="296" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="314" y="116" width="16" height="72" fill="#8fbf8f"/>
    <rect x="332" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="350" y="132" width="16" height="56" fill="#8fbf8f"/>
    <rect x="368" y="96" width="16" height="92" fill="#8fbf8f"/>
    <rect x="386" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="404" y="144" width="16" height="44" fill="#8fbf8f"/>
    <rect x="422" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="440" y="112" width="16" height="76" fill="#8fbf8f"/>
    <rect x="458" y="52" width="16" height="136" fill="#e07a6c"/>
    <rect x="476" y="128" width="16" height="60" fill="#8fbf8f"/>
  </g>

  <line x1="40" y1="128" x2="500" y2="128" stroke="#111" stroke-width="2.5"/>
  <text x="40" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">0s</text>
  <text x="468" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">30s</text>

  <!-- KEY -->
  <rect x="520" y="48" width="180" height="164" fill="#ffffff" stroke="#111"/>
  <text x="536" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">Key</text>

  <rect x="536" y="88" width="16" height="16" fill="#8fbf8f" stroke="#111" stroke-width="0.6"/>
  <text x="560" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">under the limit</text>

  <rect x="536" y="114" width="16" height="16" fill="#e07a6c" stroke="#111" stroke-width="0.6"/>
  <text x="560" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">hit the limit</text>
  <text x="560" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">CPU throttling</text>

  <line x1="536" y1="170" x2="560" y2="170" stroke="#111" stroke-width="2.5"/>
  <text x="568" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">dashboard</text>
  <text x="568" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">average</text>

  <line x1="536" y1="204" x2="560" y2="204" stroke="#e07a6c" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="568" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">CPU limit</text>

  <text x="20" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">The black line is what people watch. It never reaches the limit.</text>
  <text x="20" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">The red bars are CPU throttling. They happen every other second.</text>
  <text x="20" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">Watch container_cpu_cfs_throttled_periods_total, not this graph.</text>
</svg>
