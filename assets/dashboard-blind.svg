    <rect x="520" y="184" width="8" height="46"  fill="#d9d4c7"/>
    <rect x="531" y="66"  width="8" height="164" fill="#e07a6c"/>
    <rect x="542" y="72"  width="8" height="158" fill="#e07a6c"/>
    <rect x="553" y="188" width="8" height="42"  fill="#d9d4c7"/>
    <rect x="564" y="62"  width="8" height="168" fill="#e07a6c"/>
    <rect x="575" y="78"  width="8" height="152" fill="#e07a6c"/>
    <rect x="586" y="68"  width="8" height="162" fill="#e07a6c"/>
    <rect x="597" y="182" width="8" height="48"  fill="#d9d4c7"/>
    <rect x="608" y="60"  width="8" height="170" fill="#e07a6c"/>
    <rect x="619" y="74"  width="8" height="156" fill="#e07a6c"/>
    <rect x="630" y="186" width="8" height="44"  fill="#d9d4c7"/>
    <rect x="641" y="64"  width="8" height="166" fill="#e07a6c"/>
    <rect x="652" y="80"  width="8" height="150" fill="#e07a6c"/>
    <rect x="663" y="70"  width="8" height="160" fill="#e07a6c"/>
    <rect x="674" y="192" width="8" height="38"  fill="#d9d4c7"/>
    <rect x="685" y="62"  width="8" height="168" fill="#e07a6c"/>
    <rect x="696" y="76"  width="8" height="154" fill="#e07a6c"/>
    <rect x="707" y="184" width="8" height="46"  fill="#d9d4c7"/>
    <rect x="718" y="66"  width="8" height="164" fill="#e07a6c"/>
    <rect x="729" y="72"  width="8" height="158" fill="#e07a6c"/>
