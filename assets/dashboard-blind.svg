    <rect x="751" y="188" width="8" height="42"  fill="#d9d4c7"/>
  </g>

  <text x="430" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">0s</text>
  <text x="736" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111">30s</text>
  <text x="400" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111" transform="rotate(-90 400 145)">throttled</text>

  <text x="430" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e07a6c">Throttled almost every window.</text>

  <!-- ============ caption ============ -->
  <text x="20" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111">Same pod, same 30 seconds. The average never reaches the limit. The kernel throttled it anyway.</text>
</svg>
