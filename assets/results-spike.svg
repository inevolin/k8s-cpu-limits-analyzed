<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">spike  ·  quiet then 40 rps of /mixed</text>

  <!-- 0-100ms, plot 50-230, 180px = 100ms → 1.8 px/ms -->
  <line x1="80" y1="50" x2="80" y2="230" stroke="#ccc"/>
  <line x1="80" y1="230" x2="680" y2="230" stroke="#222"/>
  <text x="48" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">0</text>
  <text x="40" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">50</text>
  <line x1="80" y1="140" x2="680" y2="140" stroke="#eee"/>
  <text x="34" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#555">100</text>
  <text x="16" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#888" transform="rotate(-90 16 150)">ms</text>

  <!-- quiet p99: 57.4 → 103.3 y=127; 52.0 → 93.6 y=136 -->
  <rect x="150" y="127" width="48" height="103" fill="#b4482a"/>
  <rect x="206" y="136" width="48" height="94" fill="#3d5a3d"/>
  <text x="160" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b4482a">57</text>
  <text x="216" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#3d5a3d">52</text>
  <text x="162" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">quiet p99</text>

  <!-- spike p50: 47.0 → 84.6 y=145; 46.6 → 83.9 y=146 -->
  <rect x="340" y="145" width="48" height="85" fill="#b4482a"/>
  <rect x="396" y="146" width="48" height="84" fill="#3d5a3d"/>
  <text x="350" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b4482a">47</text>
  <text x="406" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#3d5a3d">47</text>
  <text x="350" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">spike p50</text>

  <!-- spike p99: 87.8 → 158 y=72; 58.8 → 106 y=124 -->
  <rect x="530" y="72" width="48" height="158" fill="#b4482a"/>
  <rect x="586" y="124" width="48" height="106" fill="#3d5a3d"/>
  <text x="540" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#b4482a">88</text>
  <text x="596" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#3d5a3d">59</text>
  <text x="540" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">spike p99</text>

  <rect x="80" y="268" width="12" height="12" fill="#b4482a"/>
  <text x="98" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">500m limit</text>
  <rect x="200" y="268" width="12" height="12" fill="#3d5a3d"/>
  <text x="218" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">no limit</text>
</svg>
