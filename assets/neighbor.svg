<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">Who actually protects your pod?</text>

  <rect x="24" y="48" width="330" height="150" fill="#f6eeea" stroke="#c4473a"/>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c4473a">limit on the busy pod</text>
  <text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">Only stops it using CPU that</text>
  <text x="40" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">would otherwise sit idle. It</text>
  <text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">gives nothing to the neighbor.</text>
  <text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c4473a">✕ Wrong tool for the job</text>

  <rect x="366" y="48" width="330" height="150" fill="#e8f0e8" stroke="#5a9a5a"/>
  <text x="382" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5a9a5a">request on your own pod</text>
  <text x="382" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">Your reserved share, held for</text>
  <text x="382" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">you whenever the node is busy.</text>
  <text x="382" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">CFS enforces it.</text>
  <text x="382" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5a9a5a">✓ This is what protects you</text>

  <!-- mini node diagram: a 4-core bar split between neighbor (capped, still can't be squeezed further) and your reserved share -->
  <text x="24" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#666666">4-core node, fully busy</text>

  <rect x="24" y="232" width="672" height="28" fill="#ffffff" stroke="#b8b2a8"/>
  <rect x="24" y="232" width="336" height="28" fill="#f6eeea"/>
  <rect x="360" y="232" width="336" height="28" fill="#e8f0e8"/>
  <line x1="360" y1="232" x2="360" y2="260" stroke="#b8b2a8"/>
  <text x="34" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#c4473a">Busy pod, capped at its limit either way</text>
  <text x="370" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5a9a5a">Your pod, share held by your request</text>

  <text x="24" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#666666">Removing the neighbor's limit does not shrink your share above.</text>
</svg>
