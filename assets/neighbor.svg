<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <rect width="720" height="250" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">who protects the neighbor?</text>

  <rect x="24" y="52" width="330" height="170" fill="#fff" stroke="#e0c8c0"/>
  <text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#b4482a">limit on the busy pod</text>
  <text x="40" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">only stops it using leftover</text>
  <text x="40" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">CPU. does not help the</text>
  <text x="40" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">app sitting next to it.</text>
  <text x="40" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6a6258">wrong tool</text>

  <rect x="366" y="52" width="330" height="170" fill="#fff" stroke="#c5d0c5"/>
  <text x="382" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3d5a3d">request on your app</text>
  <text x="382" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">this is its reserved share</text>
  <text x="382" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">when the machine is busy.</text>
  <text x="382" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">Linux already enforces that.</text>
  <text x="382" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6a6258">this is the protection</text>
</svg>
