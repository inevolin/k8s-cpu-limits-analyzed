<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="720" height="280" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#222">same burst, under the cap (~400m offered, 500m limit)</text>

  <!-- scale: 0-120ms, 4px per ms, origin x=200 y=220 -->
  <text x="24" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">500m limit</text>
  <rect x="200" y="68" width="348" height="22" fill="#b4482a"/>
  <text x="208" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#faf9f6">p50  87 ms</text>
  <rect x="200" y="96" width="408" height="22" fill="#c46a50"/>
  <text x="208" y="111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#faf9f6">p99  102 ms     frozen in half the windows</text>

  <text x="24" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#555">no limit</text>
  <rect x="200" y="144" width="91" height="22" fill="#3d5a3d"/>
  <text x="208" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#faf9f6">p50  23 ms</text>
  <rect x="200" y="172" width="175" height="22" fill="#6a8a6a"/>
  <text x="208" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#faf9f6">p99  44 ms     0 windows frozen</text>

  <line x1="200" y1="220" x2="680" y2="220" stroke="#222" stroke-width="1"/>
  <text x="200" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">0</text>
  <text x="360" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">40 ms</text>
  <text x="520" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">80 ms</text>
  <text x="650" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#555">120 ms</text>
</svg>
