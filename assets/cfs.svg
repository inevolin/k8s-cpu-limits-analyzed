<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <rect width="720" height="260" fill="#faf9f6"/>
  <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">CFS: Linux already shares a busy node by request size</text>

  <text x="24" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">all three busy</text>
  <rect x="24" y="68" width="48" height="22" fill="#a8cfa8"/>
  <text x="32" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">A 10%</text>
  <rect x="72" y="68" width="96" height="22" fill="#8fbf8f"/>
  <text x="84" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">B 20%</text>
  <rect x="168" y="68" width="336" height="22" fill="#7aaa7a"/>
  <text x="280" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">C 70%</text>
  <text x="24" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">requests 100m / 200m / 700m</text>

  <text x="24" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">C is idle. A and B split C's leftover, still 1:2</text>
  <rect x="24" y="158" width="160" height="22" fill="#a8cfa8"/>
  <text x="68" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">A 33%</text>
  <rect x="184" y="158" width="320" height="22" fill="#8fbf8f"/>
  <text x="300" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">B 67%</text>
  <rect x="504" y="158" width="168" height="22" fill="#e4ddd2"/>
  <text x="548" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#111111">C idle</text>

  <text x="24" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">No CPU limit required. A limit would only stop A or B from using C's leftover.</text>
  <text x="24" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#111111">When C wakes up, it gets 70% back immediately.</text>
</svg>
