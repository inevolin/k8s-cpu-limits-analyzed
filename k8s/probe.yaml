# An idle pod used only to scrape /gcstats over the Service.
#
# Sampling by exec-ing into the pod under test has two problems: the exec
# and its shell burn CPU inside the very cgroup being measured, and under
# heavy load the exec itself starts failing ("error executing setns
# process"), which corrupts the sample stream. Scraping from an idle pod
# instead keeps the measurement out of the measured cgroup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  labels:
    app.kubernetes.io/part-of: cpu-lab
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cpu-lab
        app: probe
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: probe
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
