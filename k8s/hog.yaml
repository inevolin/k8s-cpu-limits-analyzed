apiVersion: apps/v1
kind: Deployment
metadata:
  name: hog
  labels:
    app.kubernetes.io/part-of: cpu-lab
    app: hog
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hog
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cpu-lab
        app: hog
    spec:
      containers:
        - name: hog
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          # HOG_LOOPS busy loops per pod. Gentle leg: default 4 loops, replicas=1.
          # Saturate leg: run.sh scales replicas so total loops across the
          # deployment >= node CPUs, so the hog actually fills the node
          # instead of just adding a few busy cores next to idle capacity.
          command: ["sh", "-c", "n=\"${HOG_LOOPS:-4}\"; i=0; while [ \"$i\" -lt \"$n\" ]; do (while :; do :; done) & i=$((i+1)); done; wait"]
          env:
            - name: HOG_LOOPS
              value: "4"
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 64Mi
